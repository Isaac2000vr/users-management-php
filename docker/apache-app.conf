<VirtualHost *:${PORT}>
    ServerName localhost

    # La raiz del proyecto es la raiz web, igual que con el servidor local.
    # El .htaccess de la raiz manda todo hacia public/index.php.
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex public/index.php
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
