name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Pruebas y sintaxis
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: crud_usuarios
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql

      - name: Crear tablas y datos iniciales
        run: |
          mysql -h 127.0.0.1 -u root -proot < Infrastructure/Adapters/Persistence/MySQL/Config/database.sql

      - name: Revisar sintaxis PHP
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Ejecutar pruebas
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: crud_usuarios
          DB_USERNAME: root
          DB_PASSWORD: root
          DB_CHARSET: utf8mb4
        run: php tests/test_reserva_hotel.php

  docker:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t reservas-hotel-php .
