name: reservas-hotel-php

services:
  app:
    build: .
    container_name: reservas-hotel-php-app
    ports:
      - "8080:80"
    environment:
      PORT: "80"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: crud_usuarios
      DB_USERNAME: root
      DB_PASSWORD: local_root_password
      DB_CHARSET: utf8mb4
      DB_SSL_CA: ""
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_ENCRYPTION: tls
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM_ADDRESS: ""
      SMTP_FROM_NAME: CRUD Usuarios
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: reservas-hotel-php-mysql
    environment:
      MYSQL_ROOT_PASSWORD: local_root_password
      MYSQL_DATABASE: crud_usuarios
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Infrastructure/Adapters/Persistence/MySQL/Config/database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
